[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-extract"
version = "0.1.0"
description = "Fetch parish bulletins and process schedules with Gemini."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.5",
    "playwright>=1.55.0",
    "google-genai>=1.65.0",
    "openai>=1.55.0",
    "playwright-stealth>=2.0.2",
    "pypdf>=6.10.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_extract"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.ruff]
target-version = "py313"
line-length = 100
