[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-extract"
version = "0.1.0"
description = "Extract text from PDFs using Python."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.1",
    "pymupdf>=1.27.1",
    "openai>=2.21.0",
    "pydantic>=2.12.5",
    "playwright>=1.55.0",
    "sqlalchemy>=2.0.44",
    "docling>=2.75.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_extract"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.ruff]
target-version = "py313"
line-length = 100
