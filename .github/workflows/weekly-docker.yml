name: Weekly Docker Refresh

on:
  schedule:
    # Runs Sundays at 08:17 UTC. The offset minute avoids GitHub's top-of-hour load spike.
    - cron: "17 8 * * 0"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: weekly-docker-refresh
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build weekly image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: project-carlo-weekly:latest
          cache-from: type=gha,scope=weekly-job
          cache-to: type=gha,mode=max,scope=weekly-job

      - name: Run weekly pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          docker run --name project-carlo-weekly \
            -e GEMINI_API_KEY \
            project-carlo-weekly:latest

      - name: Copy generated outputs
        run: |
          docker cp project-carlo-weekly:/workspace/data/metadata.json data/metadata.json
          docker cp project-carlo-weekly:/workspace/data/events.json data/events.json
          docker cp project-carlo-weekly:/workspace/apps/web/public/frontend.snapshot apps/web/public/frontend.snapshot
          docker rm project-carlo-weekly

      - name: Commit generated changes
        run: |
          git add -- data/metadata.json data/events.json apps/web/public/frontend.snapshot

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          commit_date="$(date -u +%F)"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: weekly data refresh ${commit_date}"
          git push
